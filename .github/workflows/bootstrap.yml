name: Bootstrap Cloudflare (preview)

# A read-only look at what the deploy will provision.
#
# The real bootstrap runs inside `deploy.yml` on every push: it creates anything missing and fills
# the ids into that checkout, never into git. This workflow exists so you can see the plan — and
# confirm which account you are pointed at — before the first deploy touches anything.
#
# It defaults to a dry run and creating resources here is optional: because the bootstrap is
# idempotent, running it for real just means the first deploy has less to do.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the plan without creating anything
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: bootstrap

jobs:
  bootstrap:
    name: Show the plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
      INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Confirm the account
        run: pnpm exec wrangler whoami

      - name: Bootstrap
        run: |
          node scripts/cloudflare/bootstrap.mjs \
            ${{ inputs.dry_run && '--dry-run' || '' }} | tee bootstrap.log

      - name: Summarise
        run: |
          {
            echo '## Bootstrap'
            echo
            echo '```'
            cat bootstrap.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
