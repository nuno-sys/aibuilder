name: Deploy

# Push to `main` and every Worker goes live. Nothing to click.
#
# THE ORDER IS NOT A PREFERENCE. A service binding cannot name a Worker that does not exist yet:
# billing dispatches the Workflow through the generator, and the API binds both. On a first deploy,
# out of order, the API and billing simply fail. This is also why the whole estate is one job rather
# than seven parallel ones — Cloudflare's own Git integration fires them all at once, which cannot
# express this constraint.
#
# THE TENANT ZONE DEPLOYS AUTOMATICALLY TOO, and that is a decision worth knowing you made:
# `apps/renderer` carries a `*/*` route, so it serves every customer site and a bad deploy takes all
# of them down together. What stands between a bad commit and that outcome is the `verify` job — the
# same typecheck, lint and test run against this exact commit — and the fact that the tenant zone
# goes last, after the control plane has already deployed cleanly. If you ever want a human in that
# loop, give the deploy job `environment: tenant-zone` and add a required reviewer to it.
#
# WHERE CONFIGURATION LIVES:
#   · repository SECRETS  — CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Nothing else.
#   · repository VARIABLES — TURNSTILE_SITE_KEY, STRIPE_PRICE_ID, INDEXNOW_KEY. Not secret: the
#     site key is rendered into the widget, the price is quoted on the pricing page, and the
#     IndexNow key is served at `/<key>.txt` by definition.
#   · Worker SECRETS (Anthropic, Stripe, HMAC keys) are set once in the Cloudflare dashboard and are
#     never touched by a deploy. Plain vars in `wrangler.jsonc` are, so they belong in git.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never `cancel-in-progress`. Cancelling half of an ordered sequence leaves the control plane with a
# Worker rolled forward past a service binding that was not.
concurrency:
  group: deploy-${{ github.ref }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  DO_NOT_TRACK: "1"

jobs:
  # The same three gates CI runs, against the exact commit being deployed. "CI was green on this
  # branch at some point" is a different statement, and a weaker one.
  verify:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test

  deploy:
    name: Deploy every Worker
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
      INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Creates anything missing and fills the ids into this checkout — NOT into git. The ids are
      # read back from the account every run, so they are identical every time; keeping them out of
      # the repository means no commit step, no PR to merge, and no resource identifiers in history.
      # Idempotent by construction: everything is listed before it is created.
      - name: Provision Cloudflare resources
        run: node scripts/cloudflare/bootstrap.mjs

      # `apps/marketing` and `apps/app` ship static assets that wrangler uploads from a build
      # directory. Deploying without building first publishes whatever was there before, or nothing.
      - name: Build
        run: pnpm run build

      - name: Deploy generator
        run: pnpm exec wrangler deploy --config apps/generator/wrangler.jsonc
      - name: Deploy billing
        run: pnpm exec wrangler deploy --config apps/billing/wrangler.jsonc
      - name: Deploy api
        run: pnpm exec wrangler deploy --config apps/api/wrangler.jsonc
      - name: Deploy app
        run: pnpm exec wrangler deploy --config apps/app/wrangler.jsonc
      - name: Deploy marketing
        run: pnpm exec wrangler deploy --config apps/marketing/wrangler.jsonc

      # The tenant zone, last and on its own: `renderer` holds `*/*` over every customer site.
      - name: Deploy renderer
        run: pnpm exec wrangler deploy --config apps/renderer/wrangler.jsonc
      - name: Deploy media
        run: pnpm exec wrangler deploy --config apps/media/wrangler.jsonc

      - name: Summarise
        if: always()
        run: |
          {
            echo '### Deployed'
            echo
            echo 'generator → billing → api → app → marketing → renderer → media'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
